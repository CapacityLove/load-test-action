name: CapacityLab Load Test
description: >-
  Starts a CapacityLab Load Run from a CI template for this release and, by default,
  fails the job when its Result verdict is not attained.
author: CapacityLab
branding:
  icon: activity
  color: blue

inputs:
  template:
    description: CI template name configured in the CapacityLab Console.
    required: true
  ci-key:
    description: CapacityLab CI key (store it as a repository or environment secret).
    required: true
  api-url:
    description: CapacityLab API origin (the Console CI page shows it), for example https://api.example.com.
    required: true
  release:
    description: Release the run is attributed to (commit SHA or tag).
    required: false
    default: ${{ github.sha }}
  wait:
    description: Wait for the Result verdict and gate on it ("true") or return once admitted ("false").
    required: false
    default: "true"
  timeout-minutes:
    description: Longest wait for the verdict, in minutes.
    required: false
    default: "90"
  max-queue-wait-minutes:
    description: Longest time to keep retrying a retryable refusal (for example no capacity), in minutes.
    required: false
    default: "30"
  github-comment:
    description: Create or update one pull request comment with the result ("true" or "false").
    required: false
    default: "false"
  github-token:
    description: Token used for the pull request comment.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Download the CapacityLab CLI
      shell: bash
      env:
        CAPACITYLAB_API_URL: ${{ inputs.api-url }}
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --retry 3 \
          --output "$RUNNER_TEMP/capacitylab-cli.mjs" \
          "${CAPACITYLAB_API_URL%/}/api/v1/ci/cli.mjs"
    - name: Run the CapacityLab gate
      shell: bash
      env:
        # The key travels only in the environment, never on the command line.
        CAPACITYLAB_CI_KEY: ${{ inputs.ci-key }}
        CAPACITYLAB_API_URL: ${{ inputs.api-url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_TEMPLATE: ${{ inputs.template }}
        INPUT_RELEASE: ${{ inputs.release }}
        INPUT_WAIT: ${{ inputs.wait }}
        INPUT_TIMEOUT: ${{ inputs.timeout-minutes }}
        INPUT_MAX_QUEUE_WAIT: ${{ inputs.max-queue-wait-minutes }}
        INPUT_GITHUB_COMMENT: ${{ inputs.github-comment }}
      run: |
        set -euo pipefail
        args=(run "$INPUT_TEMPLATE" --timeout "$INPUT_TIMEOUT" --max-queue-wait "$INPUT_MAX_QUEUE_WAIT")
        if [ -n "$INPUT_RELEASE" ]; then args+=(--release "$INPUT_RELEASE"); fi
        if [ "$INPUT_WAIT" = "true" ]; then args+=(--wait); fi
        if [ "$INPUT_GITHUB_COMMENT" = "true" ]; then args+=(--github-comment); fi
        node "$RUNNER_TEMP/capacitylab-cli.mjs" "${args[@]}"
